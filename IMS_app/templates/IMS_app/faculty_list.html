{% extends "IMS_app/base.html" %} {% load static %} {% block content %}

<h1 style="color: #333; margin-bottom: 1em">Faculty</h1>


<table id="students" class="table">
  <thead>
    <tr>
      <th data-title="Name">Name</th>
      <th data-title="Actions">Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for faculty in faculties %}
    <tr>
      <td data-title="Name">{{ faculty.name }}</td>
      <td data-title="Actions">
        <div class="action-button-container">
          <button
            class="edit-button"
            onclick="window.location.href='{% url 'faculty_update' faculty.pk %}'"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#F3F3F3"
            >
              <path
                d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"
              />
            </svg>
          </button>
          <button
            class="others-button"
            onclick="window.location.href='{% url 'faculty_info' faculty.pk %}'"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#F3F3F3"
            >
              <path
                d="M240-400q-33 0-56.5-23.5T160-480q0-33 23.5-56.5T240-560q33 0 56.5 23.5T320-480q0 33-23.5 56.5T240-400Zm240 0q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm240 0q-33 0-56.5-23.5T640-480q0-33 23.5-56.5T720-560q33 0 56.5 23.5T800-480q0 33-23.5 56.5T720-400Z"
              />
            </svg>
          </button>
        </div>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<script>
  $(document).ready(function () {
    $("#students").DataTable();
  });
</script>
{% load static %}
<script src="{% static 'IMS_app/js/modal.js' %}"></script>
{% endblock %}
