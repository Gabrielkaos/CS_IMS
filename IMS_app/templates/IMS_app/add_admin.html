{% extends 'IMS_app/base.html' %}
{% block content %}
  <div class="form-container">
  <h2>Add New Admin</h2>

  {% if messages %}
    {% for message in messages %}
      <p style="color: green;">{{ message }}</p>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create Admin</button>
  </form>
</div>

{% endblock %}
