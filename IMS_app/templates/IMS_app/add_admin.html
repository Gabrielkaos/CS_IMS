{% extends 'IMS_app/base.html' %}
{% block content %}
<div  class="container">

  <form method="post" class="create-admin-form-box">
    <h1>Create Admin</h1>
    {% csrf_token %}
    {{ form.as_p }}
    <button class="create-admin-btn" type="submit">Create Admin</button>
  </form>

  {% if messages %}
    {% for message in messages %}
      <p>{{ message }}</p>
    {% endfor %}
  {% endif %}

</div>

{% endblock %}
